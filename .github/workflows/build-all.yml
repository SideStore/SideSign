name: reusable workflow (buildAll)

on:
  workflow_call:

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-26
    strategy:
      matrix:
        include:
          - arch: arm64
            triple: arm64-apple-macosx
          - arch: x86_64
            triple: x86_64-apple-macosx
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Cache (exact)
        id: spm-cache-exact
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: spm-release-macos-${{ matrix.arch }}-${{ github.ref_name }}-${{ github.sha }}

      - name: Restore Cache (fallback)
        if: steps.spm-cache-exact.outputs.cache-hit != 'true'
        id: spm-cache-fallback
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: spm-release-macos-${{ matrix.arch }}-${{ github.ref_name }}-
          restore-keys: |
            spm-release-macos-${{ matrix.arch }}-

      - name: Pre-populate Binary Artifacts
        run: |
          ARTIFACTS_DIR="$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          mkdir -p "$ARTIFACTS_DIR"

          OPENSSL_FILE="$ARTIFACTS_DIR/https___github_com_krzyzanowskim_OpenSSL_releases_download_3_6_2000_OpenSSL_xcframework_zip"
          if [ ! -f "$OPENSSL_FILE" ]; then
            curl -fsSL "https://github.com/krzyzanowskim/OpenSSL/releases/download/3.6.2000/OpenSSL.xcframework.zip" -o "$OPENSSL_FILE"
          fi

          UNICORN_FILE="$ARTIFACTS_DIR/https___github_com_mahee96_unicorn_releases_download_2_1_4_multiarch_Unicorn_xcframework_zip"
          if [ ! -f "$UNICORN_FILE" ]; then
            curl -fsSL "https://github.com/mahee96/unicorn/releases/download/2.1.4-multiarch/Unicorn.xcframework.zip" -o "$UNICORN_FILE"
          fi

      - name: Build macOS Binary
        run: |
          swift build -c release --triple ${{ matrix.triple }} --product sidesign
          mkdir -p dist
          cp .build/${{ matrix.triple }}/release/sidesign dist/
          cd dist && tar -czvf ../sidesign-macos-${{ matrix.arch }}.tar.gz sidesign && cd ..
          shasum -a 256 sidesign-macos-${{ matrix.arch }}.tar.gz > sidesign-macos-${{ matrix.arch }}.tar.gz.sha256

      - name: Save Cache
        if: steps.spm-cache-exact.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: spm-release-macos-${{ matrix.arch }}-${{ github.ref_name }}-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-assets-${{ matrix.arch }}
          path: sidesign-macos-${{ matrix.arch }}.tar.gz*

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils git gnupg2 libc6-dev libcurl4-openssl-dev libedit2 libgcc-s1 libsqlite3-0 libstdc++-13-dev libxml2-dev libz3-dev pkg-config tzdata zlib1g-dev libssl-dev

      - name: Setup Swift
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            SWIFT_PKG="swift-6.0.3-RELEASE-ubuntu24.04-aarch64"
            SWIFT_URL="https://download.swift.org/swift-6.0.3-release/ubuntu2404-aarch64/swift-6.0.3-RELEASE/$SWIFT_PKG.tar.gz"
          else
            SWIFT_PKG="swift-6.0.3-RELEASE-ubuntu24.04"
            SWIFT_URL="https://download.swift.org/swift-6.0.3-release/ubuntu2404/swift-6.0.3-RELEASE/$SWIFT_PKG.tar.gz"
          fi
          curl -fsSL "$SWIFT_URL" -o /tmp/swift.tar.gz
          sudo mkdir -p /usr/local/swift
          sudo tar -xzf /tmp/swift.tar.gz -C /usr/local/swift --strip-components=1
          echo "/usr/local/swift/usr/bin" >> $GITHUB_PATH
          /usr/local/swift/usr/bin/swift --version

      - name: Restore Cache (exact)
        id: spm-cache-exact
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            .build
          key: spm-release-linux-${{ matrix.arch }}-${{ github.ref_name }}-${{ github.sha }}

      - name: Restore Cache (fallback)
        if: steps.spm-cache-exact.outputs.cache-hit != 'true'
        id: spm-cache-fallback
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            .build
          key: spm-release-linux-${{ matrix.arch }}-${{ github.ref_name }}-
          restore-keys: |
            spm-release-linux-${{ matrix.arch }}-

      - name: Install Unicorn (Headers & Static Library)
        run: |
          curl -fsSL "https://github.com/mahee96/unicorn/releases/download/2.1.4-multiarch/unicorn-linux-${{ matrix.arch }}.tar.gz" -o /tmp/unicorn.tar.gz
          mkdir -p /tmp/unicorn-pkg
          tar -xzf /tmp/unicorn.tar.gz -C /tmp/unicorn-pkg
          sudo mkdir -p /usr/include/unicorn /usr/local/include/unicorn /usr/lib /usr/local/lib
          sudo cp -r /tmp/unicorn-pkg/include/unicorn/* /usr/include/unicorn/
          sudo cp -r /tmp/unicorn-pkg/include/unicorn/* /usr/local/include/unicorn/
          sudo cp /tmp/unicorn-pkg/lib/libunicorn.a /usr/lib/
          sudo cp /tmp/unicorn-pkg/lib/libunicorn.a /usr/local/lib/

      - name: Build Linux Binary
        run: |
          swift build -c release --product sidesign
          mkdir -p dist
          cp .build/release/sidesign dist/
          cd dist && tar -czvf ../sidesign-linux-${{ matrix.arch }}.tar.gz sidesign && cd ..
          shasum -a 256 sidesign-linux-${{ matrix.arch }}.tar.gz > sidesign-linux-${{ matrix.arch }}.tar.gz.sha256

      - name: Save Cache
        if: steps.spm-cache-exact.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            .build
          key: spm-release-linux-${{ matrix.arch }}-${{ github.ref_name }}-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-assets-${{ matrix.arch }}
          path: sidesign-linux-${{ matrix.arch }}.tar.gz*

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - arch: x64
            msvc_arch: x64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Cache (exact)
        id: spm-cache-exact
        uses: actions/cache/restore@v4
        with:
          path: |
            ~\AppData\Local\org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
            .build
            C:\unicorn
          key: spm-windows-${{ matrix.arch }}-swift6.0.3-sdk10.0.22621.0-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}-${{ github.sha }}

      - name: Restore Cache (fallback)
        if: steps.spm-cache-exact.outputs.cache-hit != 'true'
        id: spm-cache-fallback
        uses: actions/cache/restore@v4
        with:
          path: |
            ~\AppData\Local\org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
            .build
            C:\unicorn
          key: spm-windows-${{ matrix.arch }}-swift6.0.3-sdk10.0.22621.0-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}-
          restore-keys: |
            spm-windows-${{ matrix.arch }}-swift6.0.3-sdk10.0.22621.0-
            spm-windows-${{ matrix.arch }}-

      - name: Setup MSVC Developer Environment (Windows SDK 10.0.22621.0)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
          sdk: "10.0.22621.0"

      - name: Setup Swift on Windows
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.0.3"

      - name: Configure Windows SDK Modulemaps
        shell: pwsh
        run: |
          Write-Host "=== Clearing Clang Module Cache ==="
          if (Test-Path "$env:LOCALAPPDATA\clang\ModuleCache") {
            Remove-Item -Recurse -Force "$env:LOCALAPPDATA\clang\ModuleCache"
          }

          $share = "$env:SDKROOT\usr\share"
          $ucrtDir = "C:\Program Files (x86)\Windows Kits\10\include\10.0.22621.0\ucrt"
          $umDir = "C:\Program Files (x86)\Windows Kits\10\include\10.0.22621.0\um"

          Write-Host "=== Copying module.modulemap to Windows Kits UCRT and UM ==="
          Copy-Item "$share\ucrt.modulemap" "$ucrtDir\module.modulemap" -Force
          Copy-Item "$share\winsdk.modulemap" "$umDir\module.modulemap" -Force
          Copy-Item "$share\ucrt.apinotes" "$ucrtDir\ucrt.apinotes" -Force -ErrorAction SilentlyContinue
          Copy-Item "$share\winsdk.apinotes" "$umDir\winsdk.apinotes" -Force -ErrorAction SilentlyContinue

          Write-Host "UCRT modulemap placed at: $ucrtDir\module.modulemap"
          Write-Host "WinSDK modulemap placed at: $umDir\module.modulemap"

      - name: Install Unicorn & Dependencies (Headers & Library)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\unicorn\include | Out-Null
          New-Item -ItemType Directory -Force -Path C:\unicorn\lib | Out-Null

          if (-not (Test-Path "C:\unicorn\include\unicorn\unicorn.h")) {
            Write-Host "Unicorn not found in cache, downloading..."
            Invoke-WebRequest -Uri "https://github.com/mahee96/unicorn/releases/download/2.1.4-multiarch/unicorn-windows-${{ matrix.arch }}.zip" -OutFile C:\unicorn.zip
            Expand-Archive -Path C:\unicorn.zip -DestinationPath C:\unicorn -Force
          } else {
            Write-Host "Unicorn restored from cache!"
          }

          # Ensure zlib headers and library (zlib.lib / z.lib) are present in C:\unicorn
          if (-not (Test-Path "C:\unicorn\lib\zlib.lib") -or -not (Test-Path "C:\unicorn\include\zlib.h")) {
            Write-Host "Installing zlib static library via vcpkg..."
            vcpkg install zlib:x64-windows-static
            Copy-Item "C:\vcpkg\installed\x64-windows-static\lib\zlib.lib" "C:\unicorn\lib\zlib.lib" -Force
            Copy-Item "C:\vcpkg\installed\x64-windows-static\lib\zlib.lib" "C:\unicorn\lib\z.lib" -Force
            Copy-Item "C:\vcpkg\installed\x64-windows-static\include\zlib.h" "C:\unicorn\include\zlib.h" -Force
            Copy-Item "C:\vcpkg\installed\x64-windows-static\include\zconf.h" "C:\unicorn\include\zconf.h" -Force
          }

          if (Test-Path "C:\unicorn\include\zconf.h") {
            (Get-Content C:\unicorn\include\zconf.h) -replace '.*unistd\.h.*', '// #include <unistd.h>' | Set-Content C:\unicorn\include\zconf.h
          }

          echo "INCLUDE=$env:INCLUDE;C:\unicorn\include" >> $env:GITHUB_ENV
          echo "LIB=$env:LIB;C:\unicorn\lib" >> $env:GITHUB_ENV

      - name: Build Windows Executable
        shell: pwsh
        env:
          _CL_: "/D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
        run: |
          swift build -c release -v `
            -Xcc -IC:\unicorn\include `
            -Xcc -DWIN32=1 `
            -Xcc -DZ_HAVE_UNISTD_H=0 `
            -Xcc -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH `
            -Xcxx -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH `
            -Xcc -D_CRT_SECURE_NO_WARNINGS `
            -Xcc -D_CRT_NONSTDC_NO_WARNINGS `
            -Xswiftc -D_CRT_SECURE_NO_WARNINGS `
            -Xswiftc -D_CRT_NONSTDC_NO_WARNINGS `
            -Xcxx -IC:\unicorn\include `
            -Xlinker /LIBPATH:C:\unicorn\lib `
            -Xlinker C:\unicorn\lib\zlib.lib `
            --product sidesign
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Swift build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem -Path .build -Filter sidesign.exe -Recurse | Where-Object { $_.FullName -like "*release*" } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            Write-Error "Could not locate sidesign.exe in .build folder"
            Get-ChildItem -Path .build -Recurse | Select-Object FullName
            exit 1
          }
          Write-Host "Found binary at: $exe"
          Copy-Item $exe dist\sidesign.exe
          Compress-Archive -Path dist\sidesign.exe -DestinationPath sidesign-windows-${{ matrix.arch }}.zip
          $hash = (Get-FileHash sidesign-windows-${{ matrix.arch }}.zip -Algorithm SHA256).Hash
          "$hash  sidesign-windows-${{ matrix.arch }}.zip" | Out-File -Encoding ASCII sidesign-windows-${{ matrix.arch }}.zip.sha256

      - name: Save Cache
        if: steps.spm-cache-exact.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~\AppData\Local\org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
            .build
            C:\unicorn
          key: spm-windows-${{ matrix.arch }}-swift6.0.3-sdk10.0.22621.0-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets-${{ matrix.arch }}
          path: sidesign-windows-${{ matrix.arch }}.zip*

  build-android:
    name: Build Android (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            triple: aarch64-unknown-linux-android24
            unicorn_arch: arm64-v8a
          - arch: x86_64
            triple: x86_64-unknown-linux-android24
            unicorn_arch: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Restore Cache (exact)
        id: spm-cache-exact
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/.local/share/swift/sdks
            .build
          key: spm-release-android-${{ matrix.arch }}-${{ github.ref_name }}-${{ github.sha }}

      - name: Restore Cache (fallback)
        if: steps.spm-cache-exact.outputs.cache-hit != 'true'
        id: spm-cache-fallback
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/.local/share/swift/sdks
            .build
          key: spm-release-android-${{ matrix.arch }}-${{ github.ref_name }}-
          restore-keys: |
            spm-release-android-${{ matrix.arch }}-

      - name: Install Swift Android SDK
        run: |
          if ! swift sdk list 2>/dev/null | grep -q "${{ matrix.triple }}"; then
            curl -fsSL "https://github.com/finagolfin/swift-android-sdk/releases/download/6.0.3/swift-6.0.3-RELEASE-android-24-0.1.artifactbundle.tar.gz" -o android-sdk.tar.gz
            swift sdk install android-sdk.tar.gz
          else
            echo "Swift Android SDK already installed from cache!"
          fi

      - name: Install Unicorn (Headers & Library)
        run: |
          curl -fsSL "https://github.com/mahee96/unicorn/releases/download/2.1.4-multiarch/unicorn-android-${{ matrix.unicorn_arch }}.tar.gz" -o /tmp/unicorn.tar.gz
          mkdir -p /tmp/unicorn-pkg
          tar -xzf /tmp/unicorn.tar.gz -C /tmp/unicorn-pkg

      - name: Build Android Binary
        run: |
          swift build -c release --swift-sdk ${{ matrix.triple }} \
            -Xcc -I/tmp/unicorn-pkg/include \
            -Xcxx -I/tmp/unicorn-pkg/include \
            -Xlinker -L/tmp/unicorn-pkg/lib \
            --product sidesign
          mkdir -p dist
          cp .build/${{ matrix.triple }}/release/sidesign dist/
          cd dist && tar -czvf ../sidesign-android-${{ matrix.arch }}.tar.gz sidesign && cd ..
          shasum -a 256 sidesign-android-${{ matrix.arch }}.tar.gz > sidesign-android-${{ matrix.arch }}.tar.gz.sha256

      - name: Save Cache
        if: steps.spm-cache-exact.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/.local/share/swift/sdks
            .build
          key: spm-release-android-${{ matrix.arch }}-${{ github.ref_name }}-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-assets-${{ matrix.arch }}
          path: sidesign-android-${{ matrix.arch }}.tar.gz*
