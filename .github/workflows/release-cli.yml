name: Release SideSign CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Universal Binary
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Build arm64 & x86_64
        run: |
          swift build -c release --triple arm64-apple-macosx --product sidesign
          swift build -c release --triple x86_64-apple-macosx --product sidesign
          mkdir -p dist
          lipo -create -output dist/sidesign \
            .build/arm64-apple-macosx/release/sidesign \
            .build/x86_64-apple-macosx/release/sidesign
          codesign --force --options runtime --sign - dist/sidesign
          cd dist && tar -czvf ../sidesign-macos-universal.tar.gz sidesign && cd ..
          shasum -a 256 sidesign-macos-universal.tar.gz > sidesign-macos-universal.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: sidesign-macos-universal.tar.gz*

  build-linux:
    name: Build Linux x86_64 Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev libxml2-dev

      - name: Setup Swift
        uses: swiftlang/setup-swift-action@v2
        with:
          swift-version: "6.0"

      - name: Build Linux Binary
        run: |
          swift build -c release --product sidesign
          mkdir -p dist
          cp .build/release/sidesign dist/
          cd dist && tar -czvf ../sidesign-linux-x86_64.tar.gz sidesign && cd ..
          shasum -a 256 sidesign-linux-x86_64.tar.gz > sidesign-linux-x86_64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: sidesign-linux-x86_64.tar.gz*

  build-windows:
    name: Build Windows x64 Binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Swift on Windows
        uses: compnerd/gha-setup-swift@v0.2.3
        with:
          branch: swift-6.0-release
          tag: 6.0-RELEASE

      - name: Build Windows Executable
        shell: pwsh
        run: |
          swift build -c release --product sidesign
          mkdir dist
          Copy-Item .build\release\sidesign.exe dist\
          Compress-Archive -Path dist\sidesign.exe -DestinationPath sidesign-windows-x64.zip
          $hash = (Get-FileHash sidesign-windows-x64.zip -Algorithm SHA256).Hash
          "$hash  sidesign-windows-x64.zip" | Out-File -Encoding ASCII sidesign-windows-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: sidesign-windows-x64.zip*

  publish-release:
    name: Publish Release Assets
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
